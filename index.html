<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بوابة الحرم</title>
<meta name="description" content="بوابة أنظمة إدارة المشروع — عقد التشغيل والصيانة غير الطبي بمستشفى الحرم">
<meta name="theme-color" content="#0F2A3F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="بوابة الحرم">
<meta name="application-name" content="بوابة الحرم">
<meta name="author" content="مدير إدارة المشاريع: م. أحمد بندر الردادي">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">

<!-- ═════════ نمط التطبيق — الإعداد (السطر الوحيد اللي يتغيّر) ═════════ -->
<script>
window.APP_CONFIG = {
  // رابط النشر حق Google Apps Script (ينتهي بـ /exec)
  GAS_URL: 'https://script.google.com/macros/s/AKfycbwg8S6EVkY9M5FFhpcMrGooNkNwhmuomW5zNKaNpyHsBAikc4nKoyiIBxVLJJnJIAON/exec',
  NAME: 'بوابة الحرم',
  SUB: 'أنظمة إدارة المشروع — عقد التشغيل والصيانة غير الطبي',
  ORG: 'مستشفى الحرم',
  OWNER: 'مدير إدارة المشاريع: م. أحمد بندر الردادي',
  VERSION: '1.0.0',
  LOAD_TIMEOUT_MS: 25000
};
</script>

<!-- ═════════ Tokens ═════════ -->
<style>
:root{
  --bg:#F3F6F9;--surface:#FFFFFF;--border:#E2E8F0;--text:#0F1B2A;--muted:#5B6B7C;--faint:#94A3B8;
  --primary:#0E7C7B;--primary-600:#0B6665;--navy:#0F2A3F;--warn:#B45309;--warn-weak:#FEF3C7;
  --radius:14px;--font:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0A131C;--surface:#101D29;--border:#1E3243;--text:#E6EDF3;--muted:#9AABBC;--faint:#6B7F92;--primary:#2BB3A8;--primary-600:#239C92;--warn:#FBBF24;--warn-weak:#33270B}
}
</style>

<!-- ═════════ الغلاف ═════════ -->
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--navy);overflow:hidden}
body{font-family:var(--font);color:var(--text);-webkit-font-smoothing:antialiased}
.hidden{display:none!important}

#frame{position:fixed;top:env(safe-area-inset-top);right:env(safe-area-inset-right);bottom:env(safe-area-inset-bottom);left:env(safe-area-inset-left);
  width:calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right));height:calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  border:0;background:var(--bg);opacity:0;transition:opacity .35s}
#frame.ready{opacity:1}

/* شاشة الإقلاع */
.splash{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:linear-gradient(135deg,#0F2A3F,#0E7C7B);color:#fff;text-align:center;padding:24px;transition:opacity .35s}
.splash.out{opacity:0;pointer-events:none}
.splash img{width:96px;height:96px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.splash h1{margin:6px 0 0;font-size:24px;font-weight:700}
.splash p{margin:0;color:#CDEBE8;font-size:14px;max-width:340px;line-height:1.7}
.spin{width:32px;height:32px;margin-top:10px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.copy{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;font-size:11.5px;color:#A9D8D4;padding:0 16px;line-height:1.8}

/* حالة: غير متصل / بطيء / إعداد ناقص */
.state{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 4px 16px rgba(15,27,42,.08);
  padding:26px 22px;max-width:380px;width:100%;text-align:center}
.card .ic{width:58px;height:58px;border-radius:16px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;background:var(--warn-weak);color:var(--warn)}
.card h2{margin:0 0 6px;font-size:18px}
.card p{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border-radius:10px;border:0;
  background:var(--primary);color:#fff;font:600 15px var(--font);cursor:pointer}
.btn:hover{background:var(--primary-600)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.card small{display:block;margin-top:16px;color:var(--faint);font-size:11.5px}

/* زر التثبيت + تلميح آيفون */
.install{position:fixed;z-index:30;bottom:calc(16px + env(safe-area-inset-bottom));left:16px;display:flex;align-items:center;gap:8px;
  background:#0F2A3F;color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:10px 14px;font:600 14px var(--font);
  box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer}
.install .x{margin-inline-start:6px;opacity:.7;background:none;border:0;color:#fff;font-size:18px;cursor:pointer;line-height:1}
.ios-tip{position:fixed;z-index:30;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));background:var(--surface);color:var(--text);
  border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.2);font-size:14px;line-height:1.8;display:flex;gap:10px;align-items:flex-start}
.ios-tip b{color:var(--primary)}
.ios-tip button{margin-inline-start:auto;background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
</style>
</head>
<body>

<div class="splash" id="splash">
  <img src="icon-192.png" alt="">
  <h1 id="spName">بوابة الحرم</h1>
  <p id="spSub"></p>
  <div class="spin"></div>
  <div class="copy" id="spCopy"></div>
</div>

<iframe id="frame" title="بوابة الحرم"
  allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen"
  referrerpolicy="no-referrer-when-downgrade"></iframe>

<div class="state hidden" id="state">
  <div class="card">
    <div class="ic" id="stIc"></div>
    <h2 id="stTitle"></h2>
    <p id="stMsg"></p>
    <button class="btn" id="stRetry">إعادة المحاولة</button>
    <small id="stFoot"></small>
  </div>
</div>

<button class="install hidden" id="installBtn">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>
  <span>تثبيت التطبيق</span>
  <span class="x" id="installX" aria-label="إغلاق">×</span>
</button>

<div class="ios-tip hidden" id="iosTip">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E7C7B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
  <span>لتثبيت التطبيق: اضغط زر <b>المشاركة</b> تحت، ثم <b>«إضافة إلى الشاشة الرئيسية»</b>.</span>
  <button id="iosX" aria-label="إغلاق">×</button>
</div>

<!-- ═════════ منطق الغلاف ═════════ -->
<script>
(function () {
  'use strict';
  var C = window.APP_CONFIG || {};
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var IC = {
    wifi: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.5a15 15 0 0 1 20 0"/><path d="M5 12a10 10 0 0 1 14 0"/><path d="M8.5 15.5a5 5 0 0 1 7 0"/><path d="M12 19h.01"/><path d="M3 3l18 18"/></svg>',
    clock: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    gear: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>'
  };

  var frame = $('frame'), splash = $('splash');
  var loaded = false, timer = null;
  var year = new Date().getFullYear();

  $('spName').textContent = C.NAME || '';
  $('spSub').textContent = C.SUB || '';
  $('spCopy').textContent = '© ' + year + ' جميع الحقوق الفكرية محفوظة — ' + (C.OWNER || '');
  document.title = C.NAME || document.title;
  frame.title = C.NAME || '';

  function validUrl(u) { return /^https:\/\/script\.google\.com\/(a\/[^\/]+\/)?macros\/s\/[\w-]+\/exec/.test(String(u || '')); }

  function showState(kind) {
    var s = {
      offline: [IC.wifi, 'لا يوجد اتصال بالإنترنت', 'التطبيق يحتاج اتصال عشان يوصل للبيانات. تأكد من الشبكة واضغط إعادة المحاولة، أو بيرجع تلقائياً أول ما يرجع الاتصال.'],
      slow:    [IC.clock, 'التحميل أخذ وقت أطول من العادة', 'ممكن الشبكة ضعيفة أو خوادم Google مشغولة. جرّب مرة ثانية.'],
      config:  [IC.gear, 'الإعداد ناقص', 'رابط النظام (GAS_URL) غير مضبوط في ملف index.html. ضع رابط النشر اللي ينتهي بـ /exec ثم ارفع الملف.']
    }[kind];
    $('stIc').innerHTML = s[0];
    $('stTitle').textContent = s[1];
    $('stMsg').textContent = s[2];
    $('stRetry').classList.toggle('hidden', kind === 'config');
    $('stFoot').textContent = (C.NAME || '') + ' · v' + (C.VERSION || '');
    $('state').classList.remove('hidden');
    splash.classList.add('out');
  }
  function hideState() { $('state').classList.add('hidden'); }

  function load() {
    hideState();
    if (!validUrl(C.GAS_URL)) { showState('config'); return; }
    if (navigator.onLine === false) { showState('offline'); return; }
    loaded = false;
    splash.classList.remove('out');
    frame.classList.remove('ready');
    clearTimeout(timer);
    timer = setTimeout(function () { if (!loaded) showState('slow'); }, C.LOAD_TIMEOUT_MS || 25000);
    frame.src = C.GAS_URL + (C.GAS_URL.indexOf('?') === -1 ? '?' : '&') + 'app=1';
  }

  frame.addEventListener('load', function () {
    if (!frame.src) return;
    loaded = true;
    clearTimeout(timer);
    hideState();
    frame.classList.add('ready');
    setTimeout(function () { splash.classList.add('out'); }, 250);
  });

  $('stRetry').addEventListener('click', load);
  window.addEventListener('online', function () { if (!loaded) load(); });
  window.addEventListener('offline', function () { if (!loaded) showState('offline'); });

  /* ── التثبيت ── */
  var deferred = null;
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferred = e;
    if (!standalone && store.get('app_install_dismiss') !== '1') $('installBtn').classList.remove('hidden');
  });
  $('installBtn').addEventListener('click', function (e) {
    if (e.target && e.target.id === 'installX') {
      $('installBtn').classList.add('hidden');
      store.set('app_install_dismiss', '1');
      return;
    }
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; $('installBtn').classList.add('hidden'); });
  });
  window.addEventListener('appinstalled', function () { $('installBtn').classList.add('hidden'); });

  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios && !standalone && store.get('app_ios_tip') !== '1') {
    setTimeout(function () { $('iosTip').classList.remove('hidden'); }, 3500);
  }
  $('iosX').addEventListener('click', function () { $('iosTip').classList.add('hidden'); store.set('app_ios_tip', '1'); });

  /* ── Service Worker ── */
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }

  load();
})();
</script>
</body>
</html>
